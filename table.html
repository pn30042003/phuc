<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin quản lý đào tạo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            color: #333;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        .text-left {
            text-align: left;
        }
        .total-row {
            font-weight: bold;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <h2>Thông tin quản lý đào tạo</h2>

    <table>
        <tr>
            <th rowspan="2">STT</th>
            <th rowspan="2">Nội dung quản lý</th>
            <th colspan="2">Số lượng</th>
            <th rowspan="2">Trạng thái</th>
        </tr>
        <tr>
            <th>Đã xử lý</th>
            <th>Chưa xử lý</th>
        </tr>
        <tr>
            <td>1</td>
            <td class="text-left">Hồ sơ nhập học</td>
            <td>850</td>
            <td>25</td>
            <td>Đang cập nhật</td>
        </tr>
        <tr>
            <td>2</td>
            <td class="text-left">Đăng ký học phần</td>
            <td>1.240</td>
            <td>18</td>
            <td>Đang xử lý</td>
        </tr>
        <tr>
            <td>3</td>
            <td class="text-left">Đăng ký ký túc xá</td>
            <td>430</td>
            <td>12</td>
            <td>Đang xử lý</td>
        </tr>
        <tr>
            <td>4</td>
            <td class="text-left">Học bổng sinh viên</td>
            <td>215</td>
            <td>7</td>
            <td>Đã cập nhật</td>
        </tr>
        <tr class="total-row">
            <td colspan="2">TỔNG CỘNG</td>
            <td>2.735</td>
            <td>62</td>
            <td>---</td>
        </tr>
    </table>

</body>
</html>
