<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <form action="#" method="POST">
        
        <!-- Full Name -->
        <p>
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" minlength="3" maxlength="50" required>
        </p>

        <!-- Student Code -->
        <p>
            <label for="studentCode">Student Code:</label><br>
            <input type="text" id="studentCode" name="studentCode" placeholder="Letters and numbers only (e.g., SV001)" pattern="[A-Za-z0-9]+" required>
        </p>

        <!-- Email -->
        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        </p>

        <!-- Phone -->
        <p>
            <label for="phone">Phone Number:</label><br>
            <input type="text" id="phone" name="phone" placeholder="0123456789" pattern="[0-9]{10}" title="Phone number must be exactly 10 digits" required>
        </p>

        <!-- Date of Birth -->
        <p>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob">
        </p>

        <!-- Age -->
        <p>
            <label for="age">Age (18–30):</label><br>
            <input type="number" id="age" name="age" min="18" max="30">
        </p>

        <!-- Gender -->
        <p>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </p>

        <!-- Major -->
        <p>
            <label for="major">Major:</label><br>
            <select id="major" name="major" required>
                <option value="">-- Select a major --</option>
                <option value="it">Information Technology</option>
                <option value="ai">Artificial Intelligence</option>
                <option value="business">Business Administration</option>
                <option value="software">Software Engineering</option>
            </select>
        </p>

        <!-- Year -->
        <p>
            <label for="year">Year:</label><br>
            <select id="year" name="year">
                <option value="">-- Select year --</option>
                <option value="1">Year 1</option>
                <option value="2">Year 2</option>
                <option value="3">Year 3</option>
                <option value="4">Year 4</option>
            </select>
        </p>

        <!-- Hobbies -->
        <p>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="sports" name="hobby" value="sports">
            <label for="sports">Sports</label><br>
            <input type="checkbox" id="music" name="hobby" value="music">
            <label for="music">Music</label><br>
            <input type="checkbox" id="reading" name="hobby" value="reading">
            <label for="reading">Reading</label>
        </p>

        <!-- Programming Languages -->
        <p>
            <label>Programming Languages:</label><br>
            <input type="checkbox" id="lang_html" name="language" value="html">
            <label for="lang_html">HTML/CSS</label><br>
            <input type="checkbox" id="lang_js" name="language" value="javascript">
            <label for="lang_js">JavaScript</label><br>
            <input type="checkbox" id="lang_python" name="language" value="python">
            <label for="lang_python">Python</label><br>
            <input type="checkbox" id="lang_java" name="language" value="java">
            <label for="lang_java">Java</label>
        </p>

        <!-- Profile Picture -->
        <p>
            <label for="photo">Profile Picture:</label><br>
            <input type="file" id="photo" name="photo" accept="image/*">
        </p>

        <!-- Student ID (Readonly) -->
        <p>
            <label for="studentId">Student ID:</label><br>
            <input type="text" id="studentId" name="studentId" value="SV001" readonly>
        </p>

        <!-- Country (Disabled) -->
        <p>
            <label for="country">Country:</label><br>
            <input type="text" id="country" name="country" value="Vietnam" disabled>
        </p>

        <!-- Address -->
        <p>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="3" cols="30" placeholder="Enter your address"></textarea>
        </p>

        <!-- Introduction -->
        <p>
            <label for="introduction">Introduction (Max 200 characters):</label><br>
            <textarea id="introduction" name="introduction" rows="4" cols="30" maxlength="200" placeholder="Brief introduction about yourself"></textarea>
        </p>

        <!-- Password -->
        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </p>

        <!-- Submit & Reset Buttons -->
        <p>
            <button type="submit">Submit Form</button>
            <button type="reset">Reset Form</button>
        </p>

    </form>

</body>
</html>
